name: Test

on:
  workflow_call:

permissions: {}

# Keep only the newest test run for a branch or pull request.
concurrency:
  group: jobdeck-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: air-hand-org/jobdeck-actions/actions/setup-tools@v1.4.1
      - name: Create a service source checkout token
        id: service-source-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            jobdeck-auth
            jobdeck-job-api
            jobdeck-job-worker
            jobdeck-ui
            jobdeck-demo
            api-contracts
          permission-contents: read
      - name: Check out local service sources
        run: |
          gh auth setup-git --hostname github.com
          mise exec -- make clone-service-repo
        env:
          GH_TOKEN: ${{ steps.service-source-token.outputs.token }}
      # Service checkouts must exist before computing dependency cache keys.
      - parallel:
          - uses: air-hand-org/jobdeck-actions/actions/cache-go@v1.4.1
          - name: Restore NuGet cache
            uses: actions/cache@v5
            with:
              path: ~/.nuget/packages
              key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
              restore-keys: |
                nuget-${{ runner.os }}-
      - name: build
        run: make build
      - name: lint
        run: make lint
      - name: check clean
        run: make check-clean
      - name: test
        run: make test
      - name: upload Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: '**/playwright-traces/*.zip'
          if-no-files-found: ignore
      - name: upload Aspire resource logs
        if: ${{ failure() || runner.debug == '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: aspire-resource-logs
          path: '**/TestResults/aspire-logs/*.log'
          if-no-files-found: ignore

      - name: Preserve container E2E artifacts before testing local sources
        run: |
          while IFS= read -r -d '' artifact_dir; do
            destination="${RUNNER_TEMP}/container-e2e/${artifact_dir}"
            mkdir -p "$(dirname "$destination")"
            mv "$artifact_dir" "$destination"
          done < <(find tests/e2e -type d \( -name playwright-traces -o -path '*/TestResults/aspire-logs' \) -prune -print0)
      - name: Run the complete E2E suite against local sources
        id: local-source-test
        run: mise exec -- make cs-test
        env:
          USE_LOCAL: 'true'
          GH_TOKEN: ${{ steps.service-source-token.outputs.token }}
      - name: Upload local-source Playwright traces
        if: ${{ failure() && steps.local-source-test.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: local-source-playwright-traces
          path: '**/playwright-traces/*.zip'
          if-no-files-found: ignore
      - name: Upload local-source Aspire resource logs
        if: ${{ (failure() || runner.debug == '1') && steps.local-source-test.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: local-source-aspire-resource-logs
          path: '**/TestResults/aspire-logs/*.log'
          if-no-files-found: ignore
