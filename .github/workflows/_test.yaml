name: Test

on:
  workflow_call:

permissions: {}

# Keep only the newest test run for a branch or pull request.
concurrency:
  group: jobdeck-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-e2e:
    name: Container E2E
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Diagnose runner capacity after checkout
        if: ${{ runner.debug == '1' }}
        run: bash .github/scripts/diagnose-e2e-capacity.sh after-checkout
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: air-hand-org/jobdeck-actions/actions/setup-tools@287f4026cd3c9245ccb7755f427ce5c8ebe75482 # v1.4.1
      - name: Diagnose runner capacity before cache restore
        if: ${{ runner.debug == '1' }}
        run: bash .github/scripts/diagnose-e2e-capacity.sh before-cache-restore
      - parallel:
          - uses: air-hand-org/jobdeck-actions/actions/cache-go@326d19a15eaf6c378b6eba724ea4c9155bc1c25a # v1.6.0
            with:
              exact-key-only: 'true'
          - name: Restore NuGet cache
            uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
            with:
              path: ~/.nuget/packages
              key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
      - name: Diagnose runner capacity after cache restore
        if: ${{ runner.debug == '1' }}
        run: bash .github/scripts/diagnose-e2e-capacity.sh after-cache-restore
      - name: build
        run: make build
      - name: lint
        run: make lint
      - name: check clean
        run: make check-clean
      - name: Diagnose runner capacity before container E2E
        if: ${{ runner.debug == '1' }}
        run: bash .github/scripts/diagnose-e2e-capacity.sh before-container-e2e
      - name: test
        id: container-test
        run: make test
      - name: Diagnose runner capacity after container E2E
        if: ${{ always() && runner.debug == '1' && steps.container-test.outcome != 'skipped' }}
        run: bash .github/scripts/diagnose-e2e-capacity.sh after-container-e2e
      - name: upload Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-traces
          path: '**/playwright-traces/*.zip'
          if-no-files-found: ignore
      - name: upload Aspire resource logs
        if: ${{ failure() || runner.debug == '1' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aspire-resource-logs
          path: '**/TestResults/aspire-logs/*.log'
          if-no-files-found: ignore

      # Free disk space before post-job dependency cache archives are created.
      - name: Clean up Docker after E2E tests
        run: |
          echo "::group::Disk usage before Docker cleanup"
          df -h
          docker system df
          echo "::endgroup::"
          docker system prune -af
          echo "::group::Disk usage after Docker cleanup"
          df -h
          docker system df
          echo "::endgroup::"

  local-source-e2e:
    name: Local-source E2E
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Diagnose runner capacity after checkout
        if: ${{ runner.debug == '1' }}
        run: bash .github/scripts/diagnose-e2e-capacity.sh after-checkout
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: air-hand-org/jobdeck-actions/actions/setup-tools@287f4026cd3c9245ccb7755f427ce5c8ebe75482 # v1.4.1
      - name: Create a service source checkout token
        id: service-source-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.GH_APP_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            jobdeck-auth
            jobdeck-job-api
            jobdeck-job-worker
            jobdeck-ui
            jobdeck-demo
            api-contracts
          permission-contents: read
      - name: Check out local service sources
        run: |
          gh auth setup-git --hostname github.com
          make clone-service-repo
        env:
          GH_TOKEN: ${{ steps.service-source-token.outputs.token }}
      - name: Diagnose runner capacity before cache restore
        if: ${{ runner.debug == '1' }}
        run: bash .github/scripts/diagnose-e2e-capacity.sh before-cache-restore
      # Service checkouts must exist before computing dependency cache keys.
      - parallel:
          - uses: air-hand-org/jobdeck-actions/actions/cache-go@326d19a15eaf6c378b6eba724ea4c9155bc1c25a # v1.6.0
            with:
              exact-key-only: 'true'
          - name: Restore NuGet cache
            uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
            with:
              path: ~/.nuget/packages
              key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
      - name: Diagnose runner capacity after cache restore
        if: ${{ runner.debug == '1' }}
        run: bash .github/scripts/diagnose-e2e-capacity.sh after-cache-restore
      - name: Build local service sources
        run: mise exec -- make services-build
        env:
          GH_TOKEN: ${{ steps.service-source-token.outputs.token }}
      - name: Diagnose runner capacity before local E2E
        if: ${{ runner.debug == '1' }}
        run: bash .github/scripts/diagnose-e2e-capacity.sh before-local-e2e
      - name: Run the complete E2E suite against local sources
        id: local-source-test
        run: mise exec -- make cs-test
        env:
          USE_LOCAL: 'true'
          GH_TOKEN: ${{ steps.service-source-token.outputs.token }}
      - name: Diagnose runner capacity after local E2E
        if: ${{ always() && runner.debug == '1' && steps.local-source-test.outcome != 'skipped' }}
        run: bash .github/scripts/diagnose-e2e-capacity.sh after-local-e2e
      - name: Upload local-source Playwright traces
        if: ${{ failure() && steps.local-source-test.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: local-source-playwright-traces
          path: '**/playwright-traces/*.zip'
          if-no-files-found: ignore
      - name: Upload local-source Aspire resource logs
        if: ${{ (failure() || runner.debug == '1') && steps.local-source-test.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: local-source-aspire-resource-logs
          path: '**/TestResults/aspire-logs/*.log'
          if-no-files-found: ignore

      # Free disk space before post-job dependency cache archives are created.
      - name: Clean up Docker after E2E tests
        run: |
          echo "::group::Disk usage before Docker cleanup"
          df -h
          docker system df
          echo "::endgroup::"
          docker system prune -af
          echo "::group::Disk usage after Docker cleanup"
          df -h
          docker system df
          echo "::endgroup::"
