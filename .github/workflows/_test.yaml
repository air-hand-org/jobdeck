name: Test

on:
  workflow_call:

permissions: {}

# Keep only the newest test run for a branch or pull request.
concurrency:
  group: jobdeck-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: air-hand-org/jobdeck-actions/actions/setup-tools@v1.4.1
      - parallel:
          - uses: air-hand-org/jobdeck-actions/actions/cache-go@v1.4.1
          - name: Restore NuGet cache
            uses: actions/cache@v5
            with:
              path: ~/.nuget/packages
              key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
              restore-keys: |
                nuget-${{ runner.os }}-
      - name: build
        run: make build
      - name: lint
        run: make lint
      - name: check clean
        run: make check-clean
      - name: test
        run: make test
      - name: upload Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: '**/playwright-traces/*.zip'
          if-no-files-found: ignore
      - name: upload Aspire resource logs
        if: ${{ failure() || runner.debug == '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: aspire-resource-logs
          path: '**/TestResults/aspire-logs/*.log'
          if-no-files-found: ignore
