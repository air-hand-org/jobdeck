on:
  workflow_call:

permissions: {}

jobs:
  # This nested reusable workflow owns test-only concurrency, so cancelling a
  # superseded test run never cancels this workflow's infrastructure plan.
  test:
    uses: ./.github/workflows/_test.yaml
    permissions:
      contents: read

  container-build:
    # Keep the release-only push workflow honest: every production Dockerfile
    # must build on a pull request, without authenticating to GCP or pushing.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ui
            dockerfile: containers/ui/Dockerfile
            context: .
          - service: auth
            dockerfile: containers/auth/Dockerfile
            context: .
          - service: job-api
            dockerfile: containers/job-api/Dockerfile
            context: .
          - service: job-worker
            dockerfile: containers/job-worker/Dockerfile
            context: .
          - service: demo
            dockerfile: containers/demo/Dockerfile
            context: .
          - service: forward-proxy
            dockerfile: Dockerfile
            context: containers/forward-proxy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false

  infrastructure-plan:
    # Fork PRs run the test job, but never receive a GCP OIDC token. This
    # condition is defence in depth; the Workload Identity Provider must also
    # restrict tokens to the air-hand-org/jobdeck repository.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/_tofu.yaml
    with:
      root: bootstrap
      command: plan
      environment: plan
    secrets: inherit
    permissions:
      contents: read
      id-token: write
