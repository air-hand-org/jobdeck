on:
  workflow_call:

permissions: {}

jobs:
  infrastructure:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: $/.github/workflows/_infrastructure-changes.yaml
    with:
      command: plan
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write

  test:
    uses: $/.github/workflows/_test.yaml
    permissions:
      contents: read
      packages: read
    secrets: inherit
