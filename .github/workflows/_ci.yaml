on:
  workflow_call:

permissions: {}

jobs:
  infrastructure-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bootstrap: ${{ steps.filter.outputs.bootstrap }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/infrastructure-changes
        id: filter

  test:
    uses: ./.github/workflows/_test.yaml
    permissions:
      contents: read
      packages: read
    secrets: inherit

  infrastructure-plan:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.infrastructure-changes.outputs.bootstrap == 'true'
    needs: infrastructure-changes
    uses: ./.github/workflows/_tofu.yaml
    with:
      root: bootstrap
      command: plan
      environment: plan
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write

  application-infrastructure-plan:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.infrastructure-changes.outputs.app == 'true'
    needs: infrastructure-changes
    uses: ./.github/workflows/_tofu.yaml
    with:
      root: app
      command: plan
      environment: plan
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
