name: Request PR review

on:
  # No PR checkout/artifacts: exact command plus live repository permission check.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]

permissions: {}

jobs:
  review-eligibility:
    if: github.event.issue.pull_request && github.event.comment.body == '/review'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - id: check
        uses: $/.github/actions/review-eligibility
        with:
          github-token: ${{ github.token }}

  notify:
    needs: review-eligibility
    if: needs.review-eligibility.outputs.eligible == 'true'
    permissions:
      pull-requests: read
    uses: air-hand-org/jobdeck-actions/.github/workflows/reusable-slack-pr-review-request.yaml@11698fc773cb306a807f51353a2f67e191ecc9bf
    secrets:
      channel-id: ${{ secrets.SLACK_REVIEW_CHANNEL_ID }}
      reviewer-user-id: ${{ secrets.SLACK_REVIEWER_USER_ID }}
      slack-bot-token: ${{ secrets.SLACK_REVIEW_NOTIFIER_BOT_TOKEN }}
