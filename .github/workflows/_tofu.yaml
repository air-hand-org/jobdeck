name: OpenTofu

on:
  workflow_call:
    inputs:
      root:
        description: OpenTofu root under iac/
        required: true
        type: string
      command:
        description: OpenTofu command to run
        required: false
        type: string
        default: apply
      environment:
        description: GitHub Environment that provides GCP OIDC variables
        required: true
        type: string
permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  tofu:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TOFU_ROOT: ${{ inputs.root }}
      TOFU_ENVIRONMENT: ${{ inputs.environment }}
      TOFU_COMMAND: ${{ inputs.command }}
      TF_VAR_decrypt_secrets: ${{ inputs.root == 'app' }}
      # iac/app uses this during backend state encryption, which is configured
      # before the later `tofu plan -var=...` invocation.
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create GitHub App token for governance
        if: inputs.root == 'bootstrap'
        id: github-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_IAC_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_IAC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Do not set `repositories`: a repository created by this OpenTofu
          # run does not exist yet and therefore cannot scope the token. Apps
          # that create repositories must be installed for all repositories.
      - uses: air-hand-org/jobdeck-actions/actions/setup-tools@56b5a3e5540b1a1d42a0dbd3ae45b48910f42e83 # v1.7.3
      - name: Lint OpenTofu
        run: make tofu-lint
      - name: Validate root and environment
        shell: bash
        run: |
          case "${TOFU_COMMAND}:${TOFU_ROOT}:${TOFU_ENVIRONMENT}" in
            plan:bootstrap:plan|apply:bootstrap:bootstrap|plan:app:plan|apply:app:production) ;;
            *)
              echo "Unsupported OpenTofu command/root/environment combination: ${TOFU_COMMAND}:${TOFU_ROOT}:${TOFU_ENVIRONMENT}" >&2
              exit 1
              ;;
          esac
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Initialize OpenTofu
        run: |
          cd "iac/${TOFU_ROOT}"
          tofu init \
            -backend-config="bucket=airhand-jobdeck-bucket" \
            -backend-config="prefix=${TOFU_ROOT}"
      - name: Validate
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: |
          cd "iac/${TOFU_ROOT}"
          tofu validate -no-color
      - name: Plan
        env:
          # tfcmt uses the workflow token to update the PR comment and labels.
          # OpenTofu always uses the Environment-selected GitHub App token.
          GITHUB_TOKEN: ${{ github.token }}
          GH_IAC_TOKEN: ${{ inputs.root == 'bootstrap' && steps.github-app-token.outputs.token || '' }}
        run: |
          cd "iac/${TOFU_ROOT}"
          plan_args=(
            -out=tfplan
            -lock-timeout=10m
            -var="project_id=${{ vars.GCP_PROJECT_ID }}"
          )

          tfcmt -var "target:${TOFU_ROOT}" plan --patch -- env GITHUB_TOKEN="$GH_IAC_TOKEN" tofu plan "${plan_args[@]}"
      # Trial only: consume the successful plan, never re-plan or change its backend.
      - name: Generate TerraVision diagram
        id: diagram
        if: inputs.command == 'plan'
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          work="$(mktemp -d "$RUNNER_TEMP/terravision.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          python3 -m venv "$work/venv"
          "$work/venv/bin/pip" install --disable-pip-version-check 'terravision==0.56.1' 'Pillow==13.0.0' > "$work/install.log" 2>&1
          sudo apt-get update -qq > "$work/apt.log" 2>&1
          sudo apt-get install -y graphviz >> "$work/apt.log" 2>&1
          cd "iac/${TOFU_ROOT}"
          tofu graph > "$work/input.dot" 2> "$work/graph.log"
          # Values, instance keys, outputs and original HCL never reach the renderer.
          # Keep only configuration-level resource identifiers and dependency edges.
          tofu show -json tfplan 2> "$work/show.log" | python3 -c '
          import json, pathlib, re, sys
          work = pathlib.Path(sys.argv[1])
          plan = json.load(sys.stdin)
          resources = {}
          for r in plan.get("resource_changes", []):
              if r["mode"] != "managed":
                  continue
              kind, name = r["type"], r["name"]
              if not all(re.fullmatch(r"[A-Za-z_][A-Za-z_0-9]*", x) for x in (kind, name)):
                  raise ValueError("Unexpected resource identifier")
              address = kind + "." + name
              resources[address] = dict(address=address, mode="managed", type=kind, name=name,
                  change=dict(actions=["no-op"], before={}, after={}, after_unknown={}))
          assert resources, "No managed resources in saved plan"
          (work / "plan.json").write_text(json.dumps(dict(format_version="1.2", resource_changes=list(resources.values()))))
          source = work / "source"
          source.mkdir()
          (source / "main.tf").write_text("\n".join("resource \""+r["type"]+"\" \""+r["name"]+"\" {}" for r in resources.values()))
          edges = []
          for a, b in re.findall(r"\"([^\"]+)\"\s*->\s*\"([^\"]+)\"", (work / "input.dot").read_text()):
              if a in resources and b in resources:
                  edges.append(json.dumps(a)+" -> "+json.dumps(b)+";")
          (work / "graph.dot").write_text("digraph {\n" + "\n".join(json.dumps(a)+" [label="+json.dumps(a)+"];" for a in resources) + "\n" + "\n".join(edges) + "\n}")
          ' "$work"
          cd "$work"
          "$work/venv/bin/terravision" draw --engine tofu --source "$work/source" \
            --planfile "$work/plan.json" --graphfile "$work/graph.dot" \
            --outfile "$work/architecture" --format png --use-tf-names \
            > "$work/render.log" 2>&1
          # Re-encode pixels to discard any ancillary PNG metadata before upload.
          "$work/venv/bin/python" -c '
          import pathlib, sys
          from PIL import Image
          source, target = map(pathlib.Path, sys.argv[1:])
          assert source.is_file() and not source.is_symlink()
          with Image.open(source) as image:
              assert image.format == "PNG"
              clean = Image.new("RGB", image.size)
              clean.paste(image.convert("RGB"))
              clean.save(target, format="PNG")
          with Image.open(target) as image:
              image.verify()
          ' "$work/architecture-gcp.dot.png" "$RUNNER_TEMP/architecture-${TOFU_ROOT}.png"
          echo 'safe=true' >> "$GITHUB_OUTPUT"
      - name: Upload architecture diagram
        if: inputs.command == 'plan' && steps.diagram.outputs.safe == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: architecture-${{ inputs.root }}
          path: ${{ runner.temp }}/architecture-${{ inputs.root }}.png
          if-no-files-found: error
          retention-days: 3
      - name: Find associated pull request
        id: pull-request
        if: ${{ inputs.command == 'apply' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pull_request_number="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --paginate --jq '[.[] | select(.merged_at != null)] | first | .number // empty')"
          echo "number=${pull_request_number}" >> "$GITHUB_OUTPUT"
      - name: Apply
        if: ${{ inputs.command == 'apply' }}
        env:
          # tfcmt uses the workflow token to post to the associated PR;
          # OpenTofu uses the Environment-selected GitHub App token.
          GITHUB_TOKEN: ${{ github.token }}
          GH_IAC_TOKEN: ${{ inputs.root == 'bootstrap' && steps.github-app-token.outputs.token || '' }}
          TFCMT_PR_NUMBER: ${{ steps.pull-request.outputs.number }}
        run: |
          cd "iac/${TOFU_ROOT}"
          if [[ -n "$TFCMT_PR_NUMBER" ]]; then
            tfcmt -var "target:${TOFU_ROOT}" apply -- env GITHUB_TOKEN="$GH_IAC_TOKEN" tofu apply -lock-timeout=10m -auto-approve tfplan
          else
            GITHUB_TOKEN="$GH_IAC_TOKEN" tofu apply -lock-timeout=10m -auto-approve tfplan
          fi
