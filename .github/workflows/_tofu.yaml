name: OpenTofu

on:
  workflow_call:
    inputs:
      root:
        description: OpenTofu root under iac/
        required: true
        type: string
      command:
        description: OpenTofu command to run
        required: false
        type: string
        default: apply
      environment:
        description: GitHub Environment that provides GCP OIDC variables
        required: true
        type: string
      comment:
        description: Post the OpenTofu plan or apply result with tfcmt.
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  tofu:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TOFU_ROOT: ${{ inputs.root }}
      TOFU_ENVIRONMENT: ${{ inputs.environment }}
      TOFU_COMMAND: ${{ inputs.command }}
      TOFU_COMMENT: ${{ inputs.comment }}
      TF_VAR_decrypt_secrets: ${{ inputs.root == 'app' }}
      # iac/app uses this during backend state encryption, which is configured
      # before the later `tofu plan -var=...` invocation.
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub App token for bootstrap governance
        if: ${{ inputs.root == 'bootstrap' }}
        id: github-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_IAC_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_IAC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            jobdeck-auth
      - uses: ./.github/actions/setup-tools
      - name: Lint OpenTofu
        run: make tofu-lint
      - name: Validate root and environment
        shell: bash
        run: |
          case "${TOFU_COMMAND}:${TOFU_ROOT}:${TOFU_ENVIRONMENT}" in
            plan:bootstrap:plan|apply:bootstrap:bootstrap|plan:app:plan|apply:app:production) ;;
            *)
              echo "Unsupported OpenTofu command/root/environment combination: ${TOFU_COMMAND}:${TOFU_ROOT}:${TOFU_ENVIRONMENT}" >&2
              exit 1
              ;;
          esac
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Initialize OpenTofu
        run: |
          cd "iac/${TOFU_ROOT}"
          tofu init \
            -backend-config="bucket=airhand-jobdeck-bucket" \
            -backend-config="prefix=${TOFU_ROOT}"
      - name: Validate
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: |
          cd "iac/${TOFU_ROOT}"
          tofu validate -no-color
      - name: Plan
        env:
          # tfcmt uses the workflow token to update the PR comment and labels.
          # The OpenTofu subprocess instead receives the read-only GitHub App
          # token so GitHub provider reads retain their least-privilege scope.
          GITHUB_TOKEN: ${{ github.token }}
          GH_IAC_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: |
          cd "iac/${TOFU_ROOT}"
          plan_args=(
            -out=tfplan
            -var="project_id=${{ vars.GCP_PROJECT_ID }}"
          )

          if [[ "$TOFU_COMMAND" == "plan" && "$TOFU_COMMENT" == "true" ]]; then
            if [[ "$TOFU_ROOT" == "bootstrap" ]]; then
              tfcmt -var "target:${TOFU_ROOT}" plan --patch -- env GITHUB_TOKEN="$GH_IAC_TOKEN" tofu plan "${plan_args[@]}"
            else
              tfcmt -var "target:${TOFU_ROOT}" plan --patch -- tofu plan "${plan_args[@]}"
            fi
          elif [[ "$TOFU_ROOT" == "bootstrap" ]]; then
            GITHUB_TOKEN="$GH_IAC_TOKEN" tofu plan "${plan_args[@]}"
          else
            tofu plan "${plan_args[@]}"
          fi
      - name: Apply
        if: ${{ inputs.command == 'apply' }}
        env:
          # tfcmt uses the workflow token to post the apply result. Bootstrap
          # OpenTofu continues to use its governance App token.
          GITHUB_TOKEN: ${{ github.token }}
          GH_IAC_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: |
          cd "iac/${TOFU_ROOT}"
          if [[ "$TOFU_COMMENT" == "true" ]]; then
            if [[ "$TOFU_ROOT" == "bootstrap" ]]; then
              tfcmt -var "target:${TOFU_ROOT}" apply -- env GITHUB_TOKEN="$GH_IAC_TOKEN" tofu apply -auto-approve tfplan
            else
              tfcmt -var "target:${TOFU_ROOT}" apply -- tofu apply -auto-approve tfplan
            fi
          elif [[ "$TOFU_ROOT" == "bootstrap" ]]; then
            GITHUB_TOKEN="$GH_IAC_TOKEN" tofu apply -auto-approve tfplan
          else
            tofu apply -auto-approve tfplan
          fi
