name: Deploy

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  bootstrap:
    uses: ./.github/workflows/bootstrap.yaml
    with:
      command: apply
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  # Add the app apply job here after iac/app exists. It will depend on this
  # bootstrap job and deploy the images tagged with github.event.release.tag_name.
