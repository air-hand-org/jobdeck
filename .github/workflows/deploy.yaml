name: Deploy

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  infrastructure:
    uses: ./.github/workflows/_infrastructure-changes.yaml
    with:
      command: apply
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
