name: Temporary auth tidy

on:
  push:
    branches:
      - feat/migrator-testcontainers

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache: false
      - name: Tidy auth module
        run: |
          cd services/auth
          go mod tidy
      - name: Commit generated module files
        run: |
          if git diff --quiet -- services/auth/go.mod services/auth/go.sum; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/auth/go.mod services/auth/go.sum
          git commit -m 'test(auth): tidy Testcontainers dependencies'
          git push origin HEAD:feat/migrator-testcontainers
