name: Bootstrap GCP

on:
  workflow_dispatch:
    inputs:
      command:
        description: OpenTofu command to run
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: bootstrap
    concurrency:
      group: jobdeck-bootstrap
      cancel-in-progress: false
    defaults:
      run:
        working-directory: iac/bootstrap
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tools
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Initialize OpenTofu
        run: |
          tofu init \
            -backend-config="bucket=airhand-jobdeck-bucket" \
            -backend-config="prefix=bootstrap"
      - name: Validate
        run: tofu validate -no-color
      - name: Plan
        run: |
          tofu plan \
            -out=tfplan \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="project_number=${{ vars.GCP_PROJECT_NUMBER }}"
      - name: Apply
        if: ${{ inputs.command == 'apply' }}
        run: tofu apply -auto-approve tfplan
