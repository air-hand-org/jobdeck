name: 'CI'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  test:
    uses: ./.github/workflows/_test.yaml
    permissions:
      contents: read

  infrastructure-plan:
    uses: ./.github/workflows/_ci.yaml
    permissions:
      contents: read
      id-token: write

  check-result:
    needs:
      - test
      - infrastructure-plan
    runs-on: ubuntu-slim
    if: >-
      always() &&
      (needs.test.result == 'failure' || needs.infrastructure-plan.result == 'failure')
    steps:
      - name: exit with failure
        run: exit 1
