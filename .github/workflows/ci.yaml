name: 'CI'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  # Add CI jobs to _ci.yaml so this reusable workflow remains the single gate
  # consumed by check-result.
  ci:
    uses: ./.github/workflows/_ci.yaml
    permissions:
      contents: read
      packages: read
      id-token: write
      issues: write
      pull-requests: write
    secrets: inherit

  review-eligibility:
    needs: ci
    if: github.event_name == 'pull_request' && needs.ci.result == 'success'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - id: check
        uses: $/.github/actions/review-eligibility
        with:
          github-token: ${{ github.token }}

  request-review:
    needs: [ci, review-eligibility]
    if: needs.ci.result == 'success' && needs.review-eligibility.outputs.eligible == 'true'
    permissions:
      pull-requests: read
    uses: air-hand-org/jobdeck-actions/.github/workflows/reusable-slack-pr-review-request.yaml@56b5a3e5540b1a1d42a0dbd3ae45b48910f42e83 # v1.7.3
    secrets:
      channel-id: ${{ secrets.SLACK_REVIEW_CHANNEL_ID }}
      reviewer-user-id: ${{ secrets.SLACK_REVIEWER_USER_ID }}
      slack-bot-token: ${{ secrets.SLACK_REVIEW_NOTIFIER_BOT_TOKEN }}

  check-result:
    needs: ci
    runs-on: ubuntu-slim
    if: >-
      always() &&
      needs.ci.result == 'failure'
    steps:
      - name: exit with failure
        run: exit 1
