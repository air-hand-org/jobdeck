name: 'CI'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  # Add CI jobs to _ci.yaml so this reusable workflow remains the single gate
  # consumed by check-result.
  ci:
    uses: ./.github/workflows/_ci.yaml
    permissions:
      contents: read
      packages: read
      id-token: write
      issues: write
      pull-requests: write
    secrets: inherit

  request-review:
    needs: ci
    if: >-
      github.event_name == 'pull_request' && needs.ci.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: $/.github/actions/request-review
        with:
          github-token: ${{ github.token }}
          channel-id: ${{ secrets.SLACK_REVIEW_CHANNEL_ID }}
          reviewer-user-id: ${{ secrets.SLACK_REVIEWER_USER_ID }}
          slack-bot-token: ${{ secrets.SLACK_REVIEW_NOTIFIER_BOT_TOKEN }}

  check-result:
    needs: ci
    runs-on: ubuntu-slim
    if: >-
      always() &&
      needs.ci.result == 'failure'
    steps:
      - name: exit with failure
        run: exit 1
