name: Build images

on:
  workflow_call:
    inputs:
      push:
        description: Push images to Artifact Registry instead of only building them.
        required: false
        type: boolean
        default: false
      image_tag:
        description: Published release tag to check against production.yaml. Required when push is true.
        required: false
        type: string
        default: ""
      environment:
        description: GitHub environment containing GCP deployment variables.
        required: false
        type: string
        default: ""

concurrency:
  # CI build-only runs are disposable and share a group per ref. Publishing is
  # keyed by immutable release tag and must never be cancelled mid-push.
  group: build-images-${{ inputs.push && inputs.image_tag || github.ref }}
  cancel-in-progress: ${{ inputs.push == false }}

permissions: {}

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      refs: ${{ steps.images.outputs.refs }}
      registry: ${{ steps.images.outputs.registry }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@11dd79b4e498d471a9385aa9fb7f62bb5f52a73c # v4.0.4
        with:
          aqua_version: v2.60.1
          aqua_opts: ""
      - name: Test production image configuration
        run: |
          shellcheck .github/scripts/production-images.sh tests/production-images-test.sh
          bash tests/production-images-test.sh
      - name: Read production images
        id: images
        env:
          PUSH_IMAGES: ${{ inputs.push }}
          RELEASE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ "$PUSH_IMAGES" == true ]]; then
            refs="$(bash .github/scripts/production-images.sh "$RELEASE_TAG" auth ui demo job-api job-worker forward-proxy)"
          else
            refs="$(bash .github/scripts/production-images.sh)"
          fi
          echo "refs=$refs" >> "$GITHUB_OUTPUT"
          registry="$(jq -r '.ui | split("/")[0]' <<< "$refs")"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"

  build:
    # CI uses this path. It intentionally has neither a GitHub environment nor
    # OIDC permissions, so it cannot access GCP or push.
    if: ${{ inputs.push == false }}
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: create GitHub App token for read GOPRIVATE
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}
          permission-contents: read
          owner: ${{ github.repository_owner }}
          repositories: |
            api-contracts
      - uses: docker/setup-buildx-action@v4
      # Keep pairs small enough for the hosted runner while sharing its Docker
      # layer and BuildKit cache with every following build.
      - parallel:
          - name: Build forward-proxy image
            uses: docker/build-push-action@v7
            with:
              context: containers/forward-proxy
              file: containers/forward-proxy/Dockerfile
              push: false
          - name: Build job-api image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/job-api/Dockerfile
              push: false
              secrets: |
                github_contents_token=${{ steps.app-token.outputs.token }}
      - parallel:
          - name: Build auth image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/auth/Dockerfile
              push: false
              secrets: |
                github_contents_token=${{ steps.app-token.outputs.token }}
          - name: Build job-worker image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/job-worker/Dockerfile
              push: false
              secrets: |
                github_contents_token=${{ steps.app-token.outputs.token }}
      - parallel:
          - name: Build demo image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/demo/Dockerfile
              push: false
          - name: Build ui image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/ui/Dockerfile
              push: false
              build-args: |
                GITHUB_ACTOR=${{ github.actor }}
              secrets: |
                github_packages_token=${{ secrets.GITHUB_TOKEN }}

  publish:
    if: ${{ inputs.push == true }}
    needs: images
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: create GitHub App token for read GOPRIVATE
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}
          permission-contents: read
          owner: ${{ github.repository_owner }}
          repositories: |
            api-contracts
      - uses: docker/setup-buildx-action@v4
      - id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          # Artifact Registry accepts an OAuth access token as the Docker
          # password. This avoids configuring mutable Docker credential-helper
          # state with gcloud.
          token_format: access_token
      - name: Log in to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ needs.images.outputs.registry }}
          username: oauth2accesstoken
          password: ${{ steps.google-auth.outputs.access_token }}
      - parallel:
          - name: Build and push forward-proxy image
            uses: docker/build-push-action@v7
            with:
              context: containers/forward-proxy
              file: containers/forward-proxy/Dockerfile
              push: true
              tags: ${{ fromJSON(needs.images.outputs.refs).forward_proxy }}
          - name: Build and push job-api image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/job-api/Dockerfile
              push: true
              tags: ${{ fromJSON(needs.images.outputs.refs).job_api }}
              secrets: |
                github_contents_token=${{ steps.app-token.outputs.token }}
      - parallel:
          - name: Build and push auth image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/auth/Dockerfile
              push: true
              tags: ${{ fromJSON(needs.images.outputs.refs).auth }}
              secrets: |
                github_contents_token=${{ steps.app-token.outputs.token }}
          - name: Build and push job-worker image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/job-worker/Dockerfile
              push: true
              tags: ${{ fromJSON(needs.images.outputs.refs).job_worker }}
              secrets: |
                github_contents_token=${{ steps.app-token.outputs.token }}
      - parallel:
          - name: Build and push demo image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/demo/Dockerfile
              push: true
              tags: ${{ fromJSON(needs.images.outputs.refs).demo }}
          - name: Build and push ui image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/ui/Dockerfile
              push: true
              tags: ${{ fromJSON(needs.images.outputs.refs).ui }}
              build-args: |
                GITHUB_ACTOR=${{ github.actor }}
              secrets: |
                github_packages_token=${{ secrets.GITHUB_TOKEN }}
