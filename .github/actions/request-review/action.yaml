name: Request review
description: Apply Jobdeck review eligibility and deliver a minimal Slack request.
inputs:
  channel-id:
    required: true
    description: Slack channel
  reviewer-user-id:
    required: true
    description: Slack reviewer
  slack-bot-token:
    required: true
    description: Slack notifier token
  github-token:
    required: true
    description: Token for live PR and repository permission reads
runs:
  using: composite
  steps:
    - name: Check eligibility
      id: prepare
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        SLACK_CHANNEL_ID: ${{ inputs.channel-id }}
        SLACK_REVIEWER_USER_ID: ${{ inputs.reviewer-user-id }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const prepare = require(process.env.GITHUB_ACTION_PATH + '/review-request.js');
          const payload = await prepare({ github, context });
          if (payload) core.setOutput('payload', JSON.stringify(payload));
    - name: Send review request
      if: steps.prepare.outputs.payload != ''
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      with:
        method: chat.postMessage
        token: ${{ inputs.slack-bot-token }}
        payload: ${{ steps.prepare.outputs.payload }}
        errors: true
