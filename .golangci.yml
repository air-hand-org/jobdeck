version: "2"

linters:
  enable:
    - govet
    - revive
    - testifylint
    - gocognit
    - gocyclo
  settings:
    gocognit:
      min-complexity: 10
    gocyclo:
      min-complexity: 10
  exclusions:
    paths:
      - gen/
      - gen_*\.go
    rules:
      - path: _test\.go
        linters:
          - govet
          - revive
      # Allow only the existing diagnostic for each function, not later increases.
      - path: ^tools/pubsub/cmd/subscription/main\.go$
        linters: [gocognit]
        text: '^cognitive complexity 12 of func `ensureWithEndpoint` is high \(> 10\)$'
      - path: ^tools/pubsub/cmd/topic/main\.go$
        linters: [gocognit]
        text: '^cognitive complexity 13 of func `ensureTopic` is high \(> 10\)$'

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - gen/
      - gen_*\.go
      - _test\.go
